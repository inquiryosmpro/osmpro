<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OSM Pro — Job Tracker</title>
<meta name="theme-color" content="#0f1f18" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OSM Pro CRM" />
<style>
  :root{
    --navy:#0f1f18; --navy2:#16281f; --gold:#c9a961; --green:#5b8a72; --red:#c15c4a;
    --card:#1b2d24; --text:#eef2ee; --muted:#8a9a92;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--navy);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    color:var(--text);
    background:linear-gradient(180deg, var(--navy) 0%, #0c1912 100%);
    min-height:100vh;
  }
  #app{max-width:720px;margin:0 auto;padding:20px 16px 48px;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--gold);color:var(--navy);}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .header-left{display:flex;align-items:center;gap:12px;}
  .logo-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#a8843f);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:.5px;}
  .brand-name{font-weight:800;font-size:16px;letter-spacing:1.5px;}
  .brand-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .add-btn{display:flex;align-items:center;gap:6px;background:var(--gold);color:var(--navy);border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .stat-card{background:var(--card);border-radius:12px;padding:12px 10px;text-align:center;border:1px solid rgba(255,255,255,.06);}
  .stat-value{font-size:22px;font-weight:800;line-height:1;}
  .stat-label{font-size:10.5px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.5px;}

  .search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 12px;margin-bottom:10px;}
  .search-box input{background:transparent;border:none;outline:none;color:var(--text);font-size:13.5px;width:100%;}
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-chip{background:transparent;border:1px solid rgba(255,255,255,.12);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;}
  .filter-chip.active{background:var(--gold);border-color:var(--gold);color:var(--navy);}

  .list{display:flex;flex-direction:column;gap:10px;}
  .empty-state{text-align:center;color:var(--muted);padding:40px 20px;font-size:13.5px;background:var(--card);border-radius:12px;border:1px dashed rgba(255,255,255,.1);}

  .card{background:var(--card);border-radius:14px;padding:14px;border:1px solid rgba(255,255,255,.06);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .card-name{font-weight:700;font-size:15px;}
  .card-service{font-size:12.5px;color:var(--gold);margin-top:2px;font-weight:600;}
  .card-actions{display:flex;gap:6px;}
  .icon-btn{background:rgba(255,255,255,.06);border:none;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:14px;}
  .icon-btn.danger{background:rgba(193,92,74,.15);color:var(--red);}
  .card-meta{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .meta-row{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#c5d1cb;}
  .card-footer{display:flex;gap:6px;flex-wrap:wrap;}
  .badge{display:flex;align-items:center;gap:4px;border:none;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700;}
  .badge-green{background:rgba(91,138,114,.2);color:var(--green);}
  .badge-red{background:rgba(193,92,74,.2);color:var(--red);}
  .badge-gray{background:rgba(255,255,255,.08);color:var(--muted);}
  .badge-neutral{background:rgba(201,169,97,.15);color:var(--gold);}
  .notes{margin-top:10px;font-size:12.5px;color:var(--muted);border-top:1px solid rgba(255,255,255,.06);padding-top:8px;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--navy2);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:20px;max-height:90vh;overflow-y:auto;border:1px solid rgba(255,255,255,.08);border-bottom:none;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-title{font-size:17px;font-weight:800;}
  .close-btn{background:rgba(255,255,255,.08);border:none;border-radius:8px;width:30px;height:30px;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .field input,.field select,.field textarea{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 10px;color:var(--text);font-size:13.5px;outline:none;width:100%;}
  .field textarea{min-height:60px;resize:vertical;}

  .toggle-row{display:flex;gap:20px;margin-bottom:18px;flex-wrap:wrap;}
  .toggle-field{display:flex;align-items:center;gap:8px;background:transparent;border:none;padding:0;}
  .toggle-track{width:38px;height:22px;border-radius:20px;background:rgba(255,255,255,.15);position:relative;transition:background .15s;}
  .toggle-track.on{background:var(--green);}
  .toggle-thumb{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .15s;}
  .toggle-thumb.on{left:18px;}
  .toggle-label{font-size:13px;font-weight:600;color:var(--text);}

  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}
  .btn-cancel{background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--text);border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:600;}
  .btn-save{display:flex;align-items:center;gap:6px;background:var(--gold);color:var(--navy);border:none;border-radius:9px;padding:10px 18px;font-size:13.5px;font-weight:700;}
  .btn-delete{background:var(--red);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:700;}

  .confirm-box{background:var(--navy2);border-radius:16px;padding:20px;max-width:340px;margin:auto;border:1px solid rgba(255,255,255,.08);}
  .confirm-title{font-size:16px;font-weight:800;margin-bottom:8px;}
  .confirm-body{font-size:13px;color:var(--muted);margin-bottom:18px;}
  .confirm-actions{display:flex;justify-content:flex-end;gap:10px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const SERVICES = ["Lawn Care","Pressure Washing","Window Cleaning","Gutter Cleaning","Snow Removal","Junk Removal","Holiday Lighting","Permanent LED Lighting","Cleaning Services"];
const PAYMENT_METHODS = ["Cash","Interac","Cheque"];
const STORAGE_KEY = "osmpro_jobs";

let jobs = [];
let query = "";
let filter = "all";
let editingJob = null;
let confirmDeleteJob = null;

function loadJobs(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    jobs = raw ? JSON.parse(raw) : [];
  }catch(e){ jobs = []; }
}
function saveJobs(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(jobs));
}
function emptyJob(){
  return {
    id: crypto.randomUUID(),
    customerName:"", address:"", phone:"",
    service: SERVICES[0],
    dateBooked: new Date().toISOString().slice(0,10),
    invoiceSent:false, paid:false, paymentMethod:"", notes:"",
    createdAt: Date.now()
  };
}

function upsertJob(job){
  const idx = jobs.findIndex(j=>j.id===job.id);
  if(idx>=0) jobs[idx]=job; else jobs.unshift(job);
  saveJobs();
  editingJob = null;
  render();
}
function deleteJob(id){
  jobs = jobs.filter(j=>j.id!==id);
  saveJobs();
  confirmDeleteJob = null;
  render();
}
function toggle(id, field){
  const j = jobs.find(x=>x.id===id);
  if(!j) return;
  j[field] = !j[field];
  saveJobs();
  render();
}

function filteredJobs(){
  let list = jobs;
  if(filter==="unpaid") list = list.filter(j=>!j.paid);
  if(filter==="paid") list = list.filter(j=>j.paid);
  if(filter==="invoice-pending") list = list.filter(j=>!j.invoiceSent);
  const q = query.trim().toLowerCase();
  if(q) list = list.filter(j => [j.customerName,j.address,j.phone,j.service].join(" ").toLowerCase().includes(q));
  return [...list].sort((a,b)=> new Date(b.dateBooked) - new Date(a.dateBooked));
}

function fmtDate(d){
  if(!d) return "—";
  return new Date(d+"T00:00:00").toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"});
}
function esc(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(){
  const app = document.getElementById("app");
  const total = jobs.length;
  const unpaid = jobs.filter(j=>!j.paid).length;
  const invoicePending = jobs.filter(j=>!j.invoiceSent).length;
  const list = filteredJobs();

  app.innerHTML = `
    <header>
      <div class="header-left">
        <div class="logo-mark">OP</div>
        <div>
          <div class="brand-name">OSM PRO</div>
          <div class="brand-sub">Job & Payment Tracker</div>
        </div>
      </div>
      <button class="add-btn" id="newJobBtn">+ New Job</button>
    </header>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-value" style="color:var(--gold)">${total}</div><div class="stat-label">Total Jobs</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--red)">${unpaid}</div><div class="stat-label">Unpaid</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--green)">${invoicePending}</div><div class="stat-label">Invoice Pending</div></div>
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" placeholder="Search name, address, phone, service..." value="${esc(query)}" />
    </div>
    <div class="filter-row">
      ${[["all","All"],["unpaid","Unpaid"],["paid","Paid"],["invoice-pending","Invoice Pending"]].map(([k,l])=>`
        <button class="filter-chip ${filter===k?'active':''}" data-filter="${k}">${l}</button>
      `).join("")}
    </div>

    <main class="list">
      ${list.length===0 ? `<div class="empty-state">${jobs.length===0 ? "No jobs yet. Add your first customer with New Job." : "No jobs match your search or filter."}</div>` : list.map(cardHtml).join("")}
    </main>
  `;

  document.getElementById("newJobBtn").onclick = () => { editingJob = emptyJob(); renderModal(); };
  document.getElementById("searchInput").oninput = (e) => { query = e.target.value; render(); document.getElementById("searchInput").focus(); };
  document.querySelectorAll(".filter-chip").forEach(btn=>{
    btn.onclick = () => { filter = btn.dataset.filter; render(); };
  });
  document.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.onclick = () => { editingJob = jobs.find(j=>j.id===btn.dataset.edit); renderModal(); };
  });
  document.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.onclick = () => { confirmDeleteJob = jobs.find(j=>j.id===btn.dataset.delete); renderConfirm(); };
  });
  document.querySelectorAll("[data-toggle-invoice]").forEach(btn=>{
    btn.onclick = () => toggle(btn.dataset.toggleInvoice, "invoiceSent");
  });
  document.querySelectorAll("[data-toggle-paid]").forEach(btn=>{
    btn.onclick = () => toggle(btn.dataset.togglePaid, "paid");
  });

  renderModal();
  renderConfirm();
}

function cardHtml(job){
  return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="card-name">${esc(job.customerName)||"Unnamed customer"}</div>
          <div class="card-service">${esc(job.service)}</div>
        </div>
        <div class="card-actions">
          <button class="icon-btn" data-edit="${job.id}" title="Edit">✏️</button>
          <button class="icon-btn danger" data-delete="${job.id}" title="Delete">🗑️</button>
        </div>
      </div>
      <div class="card-meta">
        ${job.address ? `<div class="meta-row">📍 <span>${esc(job.address)}</span></div>` : ""}
        ${job.phone ? `<div class="meta-row">📞 <span>${esc(job.phone)}</span></div>` : ""}
        <div class="meta-row">📅 <span>Booked ${fmtDate(job.dateBooked)}</span></div>
      </div>
      <div class="card-footer">
        <button class="badge ${job.invoiceSent?'badge-green':'badge-gray'}" data-toggle-invoice="${job.id}">📄 ${job.invoiceSent?"Invoice Sent":"Invoice Not Sent"}</button>
        <button class="badge ${job.paid?'badge-green':'badge-red'}" data-toggle-paid="${job.id}">💲 ${job.paid?"Paid":"Unpaid"}</button>
        ${job.paymentMethod ? `<span class="badge badge-neutral">${esc(job.paymentMethod)}</span>` : ""}
      </div>
      ${job.notes ? `<div class="notes">${esc(job.notes)}</div>` : ""}
    </div>
  `;
}

function renderModal(){
  let existing = document.getElementById("modalOverlay");
  if(existing) existing.remove();
  if(!editingJob) return;

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "modalOverlay";
  overlay.innerHTML = `
    <form class="modal" id="jobForm">
      <div class="modal-header">
        <div class="modal-title">${editingJob.customerName ? "Edit Job" : "New Job"}</div>
        <button type="button" class="close-btn" id="closeModalBtn">✕</button>
      </div>
      <div class="form-grid">
        <div class="field"><label>Customer name</label><input name="customerName" value="${esc(editingJob.customerName)}" placeholder="Jane Smith" required /></div>
        <div class="field"><label>Phone number</label><input name="phone" value="${esc(editingJob.phone)}" placeholder="519-555-0134" /></div>
        <div class="field full"><label>Address</label><input name="address" value="${esc(editingJob.address)}" placeholder="123 Main St, Guelph, ON" /></div>
        <div class="field">
          <label>Service booked</label>
          <select name="service">
            ${SERVICES.map(s=>`<option value="${s}" ${editingJob.service===s?'selected':''}>${s}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Date booked</label><input type="date" name="dateBooked" value="${editingJob.dateBooked}" /></div>
        <div class="field">
          <label>Payment method</label>
          <select name="paymentMethod">
            <option value="" ${!editingJob.paymentMethod?'selected':''}>Not specified</option>
            ${PAYMENT_METHODS.map(m=>`<option value="${m}" ${editingJob.paymentMethod===m?'selected':''}>${m}</option>`).join("")}
          </select>
        </div>
        <div class="field full"><label>Notes</label><textarea name="notes" placeholder="Optional details...">${esc(editingJob.notes)}</textarea></div>
      </div>
      <div class="toggle-row">
        <button type="button" class="toggle-field" id="toggleInvoiceBtn">
          <div class="toggle-track ${editingJob.invoiceSent?'on':''}"><div class="toggle-thumb ${editingJob.invoiceSent?'on':''}"></div></div>
          <span class="toggle-label">Invoice sent</span>
        </button>
        <button type="button" class="toggle-field" id="togglePaidBtn">
          <div class="toggle-track ${editingJob.paid?'on':''}"><div class="toggle-thumb ${editingJob.paid?'on':''}"></div></div>
          <span class="toggle-label">Paid</span>
        </button>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="btn-save">✓ Save Job</button>
      </div>
    </form>
  `;
  document.body.appendChild(overlay);

  overlay.onclick = (e) => { if(e.target===overlay){ editingJob=null; renderModal(); } };
  document.getElementById("closeModalBtn").onclick = () => { editingJob=null; renderModal(); };
  document.getElementById("cancelModalBtn").onclick = () => { editingJob=null; renderModal(); };
  document.getElementById("toggleInvoiceBtn").onclick = () => { editingJob.invoiceSent = !editingJob.invoiceSent; renderModal(); };
  document.getElementById("togglePaidBtn").onclick = () => { editingJob.paid = !editingJob.paid; renderModal(); };

  document.getElementById("jobForm").onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const job = {
      ...editingJob,
      customerName: fd.get("customerName").trim(),
      phone: fd.get("phone").trim(),
      address: fd.get("address").trim(),
      service: fd.get("service"),
      dateBooked: fd.get("dateBooked"),
      paymentMethod: fd.get("paymentMethod"),
      notes: fd.get("notes").trim(),
    };
    if(!job.customerName) return;
    upsertJob(job);
  };
}

function renderConfirm(){
  let existing = document.getElementById("confirmOverlay");
  if(existing) existing.remove();
  if(!confirmDeleteJob) return;

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "confirmOverlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-title">Delete this job?</div>
      <div class="confirm-body">${esc(confirmDeleteJob.customerName)||"This customer"}'s record will be permanently removed.</div>
      <div class="confirm-actions">
        <button class="btn-cancel" id="confirmCancelBtn">Cancel</button>
        <button class="btn-delete" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target===overlay){ confirmDeleteJob=null; renderConfirm(); } };
  document.getElementById("confirmCancelBtn").onclick = () => { confirmDeleteJob=null; renderConfirm(); };
  document.getElementById("confirmDeleteBtn").onclick = () => deleteJob(confirmDeleteJob.id);
}

loadJobs();
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.log("SW registration failed", err));
  });
}
</script>
</body>
</html>
